<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momos Mission 😈🥟</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff3cac,#784ba0,#2b86c5);
font-family:sans-serif;
overflow:hidden;
color:white;
}

.container{
width:90%;
max-width:400px;
padding:30px;
text-align:center;
border-radius:25px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
box-shadow:0 0 40px rgba(255,0,180,0.7);
}

.buttons{position:relative;height:180px;}

button{
padding:12px 25px;
border-radius:30px;
border:none;
font-size:16px;
cursor:pointer;
}

#yesBtn{
background:#ff2f92;
color:white;
}

#noBtn{
position:absolute;
background:#111;
color:#ff9ad5;
left:50%;
top:70%;
transform:translate(-50%,-50%);
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.popup-content{
background:#6a00ff;
padding:25px;
border-radius:20px;
text-align:center;
width:80%;
}

.shake{animation:shake 0.3s;}
@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-6px);}
50%{transform:translateX(6px);}
75%{transform:translateX(-6px);}
100%{transform:translateX(0);}
}

.emoji{
position:absolute;
font-size:24px;
animation:float 2s forwards;
}
@keyframes float{
to{transform:translateY(-150px);opacity:0;}
}
</style>
</head>

<body>

<div class="container" id="box">
<h1 id="title">🥟 Momos khane chale?</h1>
<p>No option is just an illusion 😌</p>

<div class="buttons" id="area">
<button id="yesBtn">YES 😋</button>
<button id="noBtn">NO 😏</button>
</div>

<p id="counter">Attempts: 0</p>
</div>

<div class="popup" id="popup">
<div class="popup-content">
<p id="popupText"></p>
<button onclick="location.reload()">Restart 🔄</button>
</div>
</div>

<!-- SOUND -->
<audio id="sound" src="https://www.myinstants.com/media/sounds/mouse-click.mp3"></audio>

<script>
let attempts=0;
let activated=false;

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const popup=document.getElementById("popup");
const popupText=document.getElementById("popupText");
const title=document.getElementById("title");
const counter=document.getElementById("counter");
const sound=document.getElementById("sound");
const box=document.getElementById("box");
const area=document.getElementById("area");

const messages=[
"You can’t escape momos 😈",
"Told you already 😎",
"Game over bro 😂",
"Accept your fate 🥟"
];

// unlock sound on first click
document.body.addEventListener("click",()=>{
activated=true;
},{once:true});

function moveNo(e){
attempts++;
counter.innerText="Attempts: "+attempts;
title.innerText="It’s useless 😈";

// stronger movement (full area)
const maxX=area.clientWidth - noBtn.offsetWidth;
const maxY=area.clientHeight - noBtn.offsetHeight;

const x=Math.random()*maxX;
const y=Math.random()*maxY;

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
noBtn.style.transform="none";

// play sound only after interaction
if(activated) sound.play();

// vibration
if(navigator.vibrate) navigator.vibrate(80);

// shake
box.classList.add("shake");
setTimeout(()=>box.classList.remove("shake"),300);

// 25% fake catch 😈
if(Math.random()<0.25){
showPopup();
}
}

// 🔥 MAIN FIX: move on ANY attempt
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("mousemove",moveNo);
noBtn.addEventListener("touchstart",(e)=>{
e.preventDefault();
moveNo();
});

yesBtn.addEventListener("click",()=>{
showPopup();

// confetti
for(let i=0;i<30;i++){
let e=document.createElement("div");
e.className="emoji";
e.innerText="🥟";
e.style.left=Math.random()*window.innerWidth+"px";
e.style.top="80%";
document.body.appendChild(e);
setTimeout(()=>e.remove(),2000);
}
});

function showPopup(){
popup.style.display="flex";
popupText.innerText=messages[Math.floor(Math.random()*messages.length)];
}
</script>

</body>
</html>
