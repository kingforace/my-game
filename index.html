<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Momos Mission 😈🥟</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff3cac,#784ba0,#2b86c5);
font-family:sans-serif;
overflow:hidden;
color:white;
transition:0.2s;
}

.container{
width:90%;
max-width:400px;
padding:30px;
text-align:center;
border-radius:25px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
box-shadow:0 0 40px rgba(255,0,180,0.7);
animation:fadeIn 1s ease;
}

h1{font-size:clamp(20px,5vw,28px);margin-bottom:10px;}
p{margin-bottom:20px;}

.buttons{position:relative;height:180px;}

button{
padding:12px 25px;
border-radius:30px;
border:none;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

#yesBtn{
background:linear-gradient(45deg,#ff2f92,#ff7adf);
color:white;
box-shadow:0 0 20px #ff5fd8;
}

#noBtn{
position:absolute;
background:#111;
color:#ff9ad5;
left:50%;
top:70%;
transform:translate(-50%,-50%);
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.popup-content{
background:linear-gradient(45deg,#ff4fd8,#6a00ff);
padding:25px;
border-radius:20px;
text-align:center;
animation:pop 0.4s;
width:85%;
max-width:320px;
}

@keyframes pop{
from{transform:scale(0.6);}
to{transform:scale(1);}
}

.shake{
animation:shake 0.3s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

.emoji{
position:absolute;
font-size:24px;
animation:float 2s forwards;
}

@keyframes float{
to{transform:translateY(-150px);opacity:0;}
}

</style>
</head>

<body>

<div class="container" id="box">
<h1 id="title">🥟 Momos khane chale?</h1>
<p id="msg">No option is just an illusion 😌</p>

<div class="buttons">
<button id="yesBtn">YES 😋</button>
<button id="noBtn">NO 😏</button>
</div>

<p id="counter">Attempts: 0</p>
</div>

<div class="popup" id="popup">
<div class="popup-content">
<p id="popupText"></p>
<button onclick="location.reload()">Restart 🔄</button>
</div>
</div>

<audio id="clickSound" src="https://www.myinstants.com/media/sounds/mouse-click.mp3"></audio>

<script>
let attempts=0;

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const popup=document.getElementById("popup");
const popupText=document.getElementById("popupText");
const title=document.getElementById("title");
const counter=document.getElementById("counter");
const clickSound=document.getElementById("clickSound");
const box=document.getElementById("box");

const messages=[
"You can’t escape momos 😈",
"Told you already 😎",
"Game over bro 😂",
"Accept your fate 🥟"
];

function moveNo(){
attempts++;
counter.innerText="Attempts: "+attempts;

title.innerText="It’s useless 😈";

const x=Math.random()*250;
const y=Math.random()*120;

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
noBtn.style.transform="none";

clickSound.play();

// vibration
if(navigator.vibrate) navigator.vibrate(100);

// shake effect
box.classList.add("shake");
setTimeout(()=>box.classList.remove("shake"),300);

// fake click trick
if(Math.random()<0.1){
showPopup();
}
}

noBtn.addEventListener("mouseover",moveNo);
noBtn.addEventListener("touchstart",(e)=>{
e.preventDefault();
moveNo();
});

yesBtn.addEventListener("click",()=>{
showPopup();

// confetti
for(let i=0;i<25;i++){
let e=document.createElement("div");
e.className="emoji";
e.innerText="🥟";
e.style.left=Math.random()*window.innerWidth+"px";
e.style.top="80%";
document.body.appendChild(e);
setTimeout(()=>e.remove(),2000);
}
});

function showPopup(){
popup.style.display="flex";
popupText.innerText=messages[Math.floor(Math.random()*messages.length)];
}
</script>

</body>
</html>
